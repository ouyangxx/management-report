<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/property.html">
  <title>经营体产权配置管理系统</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      color: white;
      padding: 40px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    p {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    .loading {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: white;
      text-decoration: underline;
      font-size: 16px;
      margin-top: 20px;
      display: inline-block;
    }
    a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>经营体产权配置管理系统</h1>
    <p>正在加载配置页面...</p>
    <div class="loading"></div>
    <br><br>
    <a href="/property.html">如果没有自动跳转，请点击这里</a>
  </div>

  <script>
    // 确保跳转到 property.html
    setTimeout(() => {
      window.location.href = '/property.html';
    }, 100);
  </script>
</body>
</html>
