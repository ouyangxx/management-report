<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>经营体产权配置</title>
  <link rel="stylesheet" href="/assets/property.css?v=2026080308">
</head>
<body>
  <div class="page-loading" id="pageLoading">
    <div class="loading-card"><span class="loading-spin"></span><span>页面加载中...</span></div>
  </div>
  <div class="app">
    <aside class="sidebar">
      <div class="search"><input id="orgSearch" placeholder="搜索经营体"></div>
      <div class="tree" id="tree"></div>
    </aside>
    <main class="main">
      <div class="bar">
        <div class="path" id="currentPath">当前经营体：能电BG &gt; 能良移动</div>
        <div class="top-actions">
          <button class="save-btn" id="saveBtn">确认配置</button>
          <button class="download" id="downloadBtn">下载全部已确认配置</button>
        </div>
      </div>
      <section class="panel" id="panel"><div class="empty">页面加载中...</div></section>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="dialog">
      <div class="dialog-head">
        <div class="dialog-title" id="modalTitle"></div>
        <button class="close" id="closeModal">×</button>
      </div>
      <div class="dialog-tools">
        <input id="optionSearch" placeholder="搜索">
        <button class="plain" id="selectAll">全选</button>
        <button class="plain" id="clearSelected">清空</button>
      </div>
      <div class="smart-box" id="smartBox">
        <div class="smart-row">
          <textarea id="smartInput" placeholder="智能识别：可粘贴英文逗号分隔的店铺名称"></textarea>
          <button class="smart-btn" id="smartBtn">识别</button>
        </div>
        <div class="smart-tip" id="smartTip">按英文逗号分割，自动选中匹配到的店铺</div>
      </div>
      <div class="platform-cascade" id="platformCascade">
        <div class="cascade-col">
          <div class="cascade-title">国家</div>
          <div class="cascade-list" id="platformCountryList"></div>
        </div>
        <div class="cascade-col">
          <div class="cascade-title">百大平台</div>
          <div class="cascade-list" id="platformGroupList"></div>
        </div>
        <div class="cascade-col">
          <div class="cascade-title">平台名称</div>
          <div class="cascade-list" id="platformNameList"></div>
        </div>
      </div>
      <div class="country-cascade" id="countryCascade">
        <div class="cascade-col">
          <div class="cascade-title">区域</div>
          <div class="cascade-list" id="countryRegionList"></div>
        </div>
        <div class="cascade-col">
          <div class="cascade-title">国家/地区名称</div>
          <div class="cascade-list" id="countryNameList"></div>
        </div>
      </div>
      <div class="platform-selected" id="platformSelectedBox">
        <div class="selected-title" id="selectedTitle">已选平台</div>
        <div class="selected-platforms" id="selectedPlatformList"></div>
      </div>
      <div class="tag-list" id="tagList"></div>
      <div class="dialog-foot">
        <button class="plain" id="cancelModal">取消</button>
        <button class="primary" id="confirmModal">确定</button>
      </div>
    </div>
  </div>

  <script type="module" src="/assets/property.js?v=2026080308"></script>
</body>
</html>
